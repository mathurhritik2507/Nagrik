name: Nagrik browser smoke
on:
  push:
    branches: [feature/nagrik-web-v2-working-flows, fix/remove-mandatory-email-verification]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run export:web
      - run: npm install --no-save playwright-core
      - name: Serve exported website
        run: |
          npx --yes serve -s dist -l 3000 --no-clipboard > /tmp/nagrik-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nagrik-server.log
          exit 1
      - name: Verify real browser rendering
        run: node scripts/smoke-web.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nagrik-smoke-screenshots
          path: smoke-*.png
